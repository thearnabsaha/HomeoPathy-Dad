<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 192 192" fill="none">
  <defs>
    <radialGradient id="apple-clean-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>

    <linearGradient id="apple-green-cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="30%" stop-color="#a3e635"/>
      <stop offset="70%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>

    <linearGradient id="apple-leaf-main" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="40%" stop-color="#65a30d"/>
      <stop offset="80%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#d9f99d"/>
    </linearGradient>

    <linearGradient id="apple-leaf-side" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="70%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#bef264"/>
    </linearGradient>

    <linearGradient id="apple-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="50%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>

    <filter id="apple-clean-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="192" height="192" fill="url(#apple-clean-bg)"/>

  <g transform="translate(96, 96)">
    <!-- Outer Dynamic Circular Ring -->
    <path d="M-50 48 A72 72 0 1 1 48 -54"
          fill="none"
          stroke="url(#apple-ring-grad)"
          stroke-width="5"
          stroke-linecap="round"/>

    <path d="M54 -38 A72 72 0 0 1 70 -6"
          fill="none"
          stroke="url(#apple-ring-grad)"
          stroke-width="2.5"
          stroke-linecap="round"
          opacity="0.85"/>

    <!-- Medical Cross -->
    <g filter="url(#apple-clean-shadow)">
      <rect x="-16" y="-45" width="32" height="90" rx="7.5" fill="url(#apple-green-cross)"/>
      <rect x="-45" y="-16" width="90" height="32" rx="7.5" fill="url(#apple-green-cross)"/>
    </g>

    <!-- 3 Natural Leaves -->
    <g>
      <!-- Stem -->
      <path d="M-58 48 C-44 52 -26 45 -11 28 C0 15 15 -6 30 -32"
            fill="none"
            stroke="#ffffff"
            stroke-width="2.5"
            stroke-linecap="round"/>
      <path d="M-58 48 C-44 52 -26 45 -11 28 C0 15 15 -6 30 -32"
            fill="none"
            stroke="url(#apple-leaf-main)"
            stroke-width="1.6"
            stroke-linecap="round"/>

      <!-- 1. Center Main Leaf -->
      <path d="M-11 32 C-17 -4 8 -36 34 -36 C44 -4 15 24 -11 32 Z"
            fill="url(#apple-leaf-main)"/>
      <path d="M-11 32 Q11 0 34 -36"
            fill="none"
            stroke="#ffffff"
            stroke-width="1.5"
            stroke-linecap="round"
            opacity="0.9"/>

      <!-- 2. Left Side Leaf -->
      <path d="M-15 32 C-40 28 -51 9 -51 -6 C-32 -4 -17 13 -15 32 Z"
            fill="url(#apple-leaf-side)"/>
      <path d="M-15 32 Q-32 17 -51 -6"
            fill="none"
            stroke="#ffffff"
            stroke-width="1.2"
            stroke-linecap="round"
            opacity="0.85"/>

      <!-- 3. Bottom Leaf -->
      <path d="M-9 34 C-6 51 17 59 32 55 C25 42 8 36 -9 34 Z"
            fill="url(#apple-leaf-side)"/>
      <path d="M-9 34 Q11 46 32 55"
            fill="none"
            stroke="#ffffff"
            stroke-width="1"
            stroke-linecap="round"
            opacity="0.85"/>
    </g>
  </g>
</svg>
