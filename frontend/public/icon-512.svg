<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradients in Royal Purple -->
    <radialGradient id="homeo-bg-512" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#281043"/>
      <stop offset="50%" stop-color="#150626"/>
      <stop offset="100%" stop-color="#080210"/>
    </radialGradient>
    
    <linearGradient id="homeo-border-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Mortar & Pestle Gradients -->
    <linearGradient id="mortar-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="40%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#1e0840"/>
    </linearGradient>

    <linearGradient id="mortar-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <linearGradient id="pestle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f5d0fe"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Botanical Leaf Gradient (Homeopathic Materia Medica) -->
    <linearGradient id="herb-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>

    <!-- Homeopathic Potentization Droplet & Liquid -->
    <linearGradient id="drop-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f5d0fe"/>
      <stop offset="70%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Globules (Homeopathic Sugar Pellets) Gradient -->
    <radialGradient id="pellet-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </radialGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="homeo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="homeo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="pellet-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3b0764" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Deep Purple Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#homeo-bg-512)" stroke="url(#homeo-border-512)" stroke-width="4"/>

  <!-- Ambient Neon Aura -->
  <circle cx="256" cy="270" r="150" fill="#9333ea" opacity="0.22" filter="url(#homeo-glow)"/>
  <circle cx="256" cy="250" r="90" fill="#e879f9" opacity="0.28" filter="url(#homeo-glow)"/>

  <!-- Concentric Potentization Ripple Rings (Dynamization / Similia) -->
  <g opacity="0.3" stroke="#e879f9" stroke-width="1.8" fill="none">
    <ellipse cx="256" cy="148" rx="80" ry="24" stroke-dasharray="6 4"/>
    <ellipse cx="256" cy="148" rx="120" ry="36" stroke-dasharray="8 6"/>
  </g>

  <!-- Main Homeopathic Mortar & Pestle Ensemble -->
  <g filter="url(#homeo-shadow)">
    
    <!-- Pestle (Diagonal Trituration Rod) Behind Mortar Rim -->
    <g transform="translate(230, 210) rotate(-38)">
      <!-- Pestle Head (Top handle) -->
      <path d="M-16 -120 C-16 -136 0 -148 16 -148 C32 -148 48 -136 48 -120 L42 20 C42 40 28 56 16 56 C4 56 -10 40 -10 20 Z" fill="url(#pestle-grad)"/>
      <!-- Pestle Gloss Highlight -->
      <path d="M-6 -130 L0 30" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Classical Homeopathic Mortar Bowl -->
    <!-- Mortar Base Stand -->
    <ellipse cx="256" cy="388" rx="96" ry="20" fill="#1e0840" stroke="#c084fc" stroke-width="2" stroke-opacity="0.4"/>
    <path d="M192 384 C192 370 204 362 216 358 L296 358 C308 362 320 370 320 384 Z" fill="#2e1065"/>

    <!-- Mortar Bowl Body -->
    <path d="M136 244 C136 332 186 372 256 372 C326 372 376 332 376 244 L136 244 Z"
          fill="url(#mortar-body)"
          stroke="#c084fc"
          stroke-width="3"
          stroke-opacity="0.45"/>

    <!-- Inner Glow in Mortar Cavity -->
    <ellipse cx="256" cy="244" rx="116" ry="32" fill="#150626"/>
    <ellipse cx="256" cy="244" rx="100" ry="24" fill="#a855f7" opacity="0.2" filter="url(#homeo-glow)"/>

    <!-- Mortar Lip / Rim -->
    <ellipse cx="256" cy="244" rx="120" ry="32" fill="none" stroke="url(#mortar-rim)" stroke-width="6"/>

    <!-- Mortar Front Specular Sheen -->
    <path d="M164 268 C174 330 210 358 256 358" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.35" fill="none"/>
  </g>

  <!-- Homeopathic Sugar Globules / Pellets (The Iconic Sweet Round Pills) -->
  <g filter="url(#pellet-shadow)">
    <!-- Pellets nestled in mortar & around -->
    <!-- Center cluster -->
    <circle cx="256" cy="246" r="14" fill="url(#pellet-grad)"/>
    <circle cx="282" cy="254" r="12" fill="url(#pellet-grad)"/>
    <circle cx="230" cy="254" r="13" fill="url(#pellet-grad)"/>
    <circle cx="250" cy="268" r="11" fill="url(#pellet-grad)"/>
    <circle cx="272" cy="272" r="10" fill="url(#pellet-grad)"/>
    <!-- Floating / Prepared potentized pellets -->
    <circle cx="340" cy="340" r="13" fill="url(#pellet-grad)" filter="url(#homeo-glow)"/>
    <circle cx="368" cy="360" r="9" fill="url(#pellet-grad)"/>
    <circle cx="160" cy="354" r="10" fill="url(#pellet-grad)"/>
  </g>

  <!-- Homeopathic Herbal Branch (Botanical Materia Medica Sprouting from Remedy) -->
  <g filter="url(#homeo-shadow)">
    <!-- Main stem -->
    <path d="M300 240 C345 205 375 160 380 100" stroke="url(#herb-grad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    
    <!-- Top Leaf -->
    <path d="M380 100 C395 108 410 102 414 84 C410 68 392 68 380 100 Z" fill="url(#herb-grad)"/>
    <!-- Side Leaf 1 (Right) -->
    <path d="M366 128 C392 134 402 120 404 106 C388 102 374 114 366 128 Z" fill="url(#herb-grad)"/>
    <!-- Side Leaf 2 (Left) -->
    <path d="M336 172 C316 160 312 142 322 132 C338 136 342 156 336 172 Z" fill="url(#herb-grad)"/>
    <!-- Side Leaf 3 (Right) -->
    <path d="M352 162 C376 170 384 158 384 146 C370 144 358 152 352 162 Z" fill="url(#herb-grad)"/>
  </g>

  <!-- Single Pure Potentization Droplet (Dynamization Drop Falling into Globules) -->
  <g filter="url(#homeo-glow)">
    <path d="M256 96 C256 96 280 134 280 152 C280 166 269 176 256 176 C243 176 232 166 232 152 C232 134 256 96 256 96 Z"
          fill="url(#drop-grad)"/>
    <!-- Droplet Highlight -->
    <path d="M245 142 C245 132 250 120 256 112" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <!-- Center Sparkle in Drop -->
    <circle cx="256" cy="154" r="4.5" fill="#ffffff"/>
  </g>

  <!-- AI Intelligence Star Sparkles (Similia Sparkles) -->
  <!-- Top Left Sparkle -->
  <g transform="translate(130, 110)">
    <path d="M0 -24 Q4 -4 24 0 Q4 4 0 24 Q-4 4 -24 0 Q-4 -4 0 -24 Z" fill="#ffffff" filter="url(#homeo-glow)"/>
    <circle cx="0" cy="0" r="4" fill="#f0abfc"/>
  </g>

  <!-- Right Accent Sparkle -->
  <g transform="translate(416, 210) scale(0.65)">
    <path d="M0 -22 Q3 -3 22 0 Q3 3 0 22 Q-3 3 -22 0 Q-3 -3 0 -22 Z" fill="#e879f9"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Bottom Accent Sparkle -->
  <g transform="translate(125, 290) scale(0.45)">
    <path d="M0 -20 Q3 -3 20 0 Q3 3 0 20 Q-3 3 -20 0 Q-3 -3 0 -20 Z" fill="#f5d0fe"/>
  </g>
</svg>