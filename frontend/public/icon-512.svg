<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-clean-512" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>

    <!-- Border Subtle -->
    <linearGradient id="border-clean-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Vibrant Lime-to-Emerald Green Gradient (Exact Match to Reference) -->
    <linearGradient id="green-cross-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="30%" stop-color="#a3e635"/>
      <stop offset="70%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>

    <linearGradient id="leaf-main-512" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="40%" stop-color="#65a30d"/>
      <stop offset="80%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#d9f99d"/>
    </linearGradient>

    <linearGradient id="leaf-side-512" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="70%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#bef264"/>
    </linearGradient>

    <linearGradient id="ring-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="50%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="clean-shadow-512" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>

    <filter id="leaf-lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="6" stdDeviation="8" flood-color="#365314" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Clean Minimalist Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-clean-512)" stroke="url(#border-clean-512)" stroke-width="3"/>

  <!-- Logo Group Center -->
  <g transform="translate(256, 256)">
    
    <!-- Outer Dynamic Circular Ring -->
    <path d="M-135 125 A190 190 0 1 1 125 -142"
          fill="none"
          stroke="url(#ring-grad-512)"
          stroke-width="13"
          stroke-linecap="round"/>

    <!-- Subtle Secondary Tapering Ring Arc (Top Right) -->
    <path d="M142 -100 A190 190 0 0 1 188 -15"
          fill="none"
          stroke="url(#ring-grad-512)"
          stroke-width="6.5"
          stroke-linecap="round"
          opacity="0.85"/>

    <!-- Medical Cross with Rounded Minimalist Corners -->
    <g filter="url(#clean-shadow-512)">
      <!-- Vertical bar of cross -->
      <rect x="-42" y="-120" width="84" height="240" rx="20" fill="url(#green-cross-512)"/>
      <!-- Horizontal bar of cross -->
      <rect x="-120" y="-42" width="240" height="84" rx="20" fill="url(#green-cross-512)"/>
    </g>

    <!-- 3 Natural Homeopathic / Herbal Leaves (Matching Reference Layout) -->
    <g filter="url(#leaf-lift)">
      
      <!-- Stem Swirling From Bottom-Left Ring Arc -->
      <path d="M-155 125 C-115 135 -70 120 -30 75 C0 40 40 -15 80 -85"
            fill="none"
            stroke="#ffffff"
            stroke-width="6.5"
            stroke-linecap="round"/>

      <path d="M-155 125 C-115 135 -70 120 -30 75 C0 40 40 -15 80 -85"
            fill="none"
            stroke="url(#leaf-main-512)"
            stroke-width="4.5"
            stroke-linecap="round"/>

      <!-- 1. Large Main Center Leaf (Pointing Upward-Right) -->
      <g>
        <path d="M-30 85 C-45 -10 20 -95 90 -95 C115 -10 40 65 -30 85 Z"
              fill="url(#leaf-main-512)"/>
        <!-- Central Leaf Vein / Accent Curve -->
        <path d="M-30 85 Q30 0 90 -95"
              fill="none"
              stroke="#ffffff"
              stroke-width="4"
              stroke-linecap="round"
              opacity="0.9"/>
        <!-- Subtle Side Vein -->
        <path d="M5 25 Q35 15 55 35"
              fill="none"
              stroke="#ffffff"
              stroke-width="2.5"
              stroke-linecap="round"
              opacity="0.65"/>
      </g>

      <!-- 2. Side Leaf on Left (Pointing Diagonally Up-Left) -->
      <g>
        <path d="M-40 85 C-105 75 -135 25 -135 -15 C-85 -10 -45 35 -40 85 Z"
              fill="url(#leaf-side-512)"/>
        <path d="M-40 85 Q-85 45 -135 -15"
              fill="none"
              stroke="#ffffff"
              stroke-width="3"
              stroke-linecap="round"
              opacity="0.85"/>
      </g>

      <!-- 3. Bottom Leaf (Curving Along the Base) -->
      <g>
        <path d="M-25 90 C-15 135 45 155 85 145 C65 110 20 95 -25 90 Z"
              fill="url(#leaf-side-512)"/>
        <path d="M-25 90 Q30 120 85 145"
              fill="none"
              stroke="#ffffff"
              stroke-width="2.5"
              stroke-linecap="round"
              opacity="0.85"/>
      </g>
    </g>

  </g>
</svg>