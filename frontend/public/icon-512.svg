<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Deep Obsidian with emerald ambient aura -->
    <radialGradient id="no-leaf-bg-512" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0f1f1a"/>
      <stop offset="50%" stop-color="#08120f"/>
      <stop offset="100%" stop-color="#030605"/>
    </radialGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="no-leaf-border-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Vibrant Medical Cross Gradients -->
    <linearGradient id="cross-main-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="30%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="cross-sheen-512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Circular Ring Gradient -->
    <linearGradient id="ring-glow-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="80%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Ambient Glow & Shadows -->
    <filter id="emerald-aura-512" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cross-shadow-512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Clean Minimalist Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#no-leaf-bg-512)" stroke="url(#no-leaf-border-512)" stroke-width="3.5"/>

  <!-- Ambient Emerald Light in Center -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.18" filter="url(#emerald-aura-512)"/>
  <circle cx="256" cy="256" r="80" fill="#34d399" opacity="0.22" filter="url(#emerald-aura-512)"/>

  <!-- Center Composition -->
  <g transform="translate(256, 256)">

    <!-- Dynamic Minimalist Framing Circle Arc -->
    <path d="M-135 135 A190 190 0 1 1 135 -135"
          fill="none"
          stroke="url(#ring-glow-512)"
          stroke-width="12"
          stroke-linecap="round"/>

    <!-- Subtle Top-Right Accent Echo Arc -->
    <path d="M152 -95 A190 190 0 0 1 190 -10"
          fill="none"
          stroke="url(#ring-glow-512)"
          stroke-width="6"
          stroke-linecap="round"
          opacity="0.8"/>

    <!-- Pure Minimalist Medical Cross (No Leaves) -->
    <g filter="url(#cross-shadow-512)">
      <!-- Vertical Arm -->
      <rect x="-44" y="-124" width="88" height="248" rx="30" fill="url(#cross-main-512)"/>
      <!-- Horizontal Arm -->
      <rect x="-124" y="-44" width="248" height="88" rx="30" fill="url(#cross-main-512)"/>

      <!-- Inner Gloss & Glass Sheen Highlights -->
      <g opacity="0.6">
        <rect x="-40" y="-120" width="80" height="90" rx="26" fill="url(#cross-sheen-512)"/>
        <rect x="-120" y="-40" width="90" height="80" rx="26" fill="url(#cross-sheen-512)"/>
      </g>

      <!-- Center Core Accent Pulse / Highlight -->
      <circle cx="0" cy="0" r="16" fill="#ffffff" opacity="0.9"/>
      <circle cx="0" cy="0" r="8" fill="#10b981"/>
    </g>

    <!-- Subtle AI Star Sparkle (Top-Right) -->
    <g transform="translate(148, -100) scale(0.65)" filter="url(#emerald-aura-512)">
      <path d="M0 -22 Q3 -3 22 0 Q3 3 0 22 Q-3 3 -22 0 Q-3 -3 0 -22 Z" fill="#ffffff"/>
      <circle cx="0" cy="0" r="3.5" fill="#34d399"/>
    </g>

  </g>
</svg>