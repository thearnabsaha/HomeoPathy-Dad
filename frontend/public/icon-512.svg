<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Cross Gradients -->
    <linearGradient id="cross-grad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Leaf Gradients -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- AI Sparkle Gradient -->
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Aura Glow Filter -->
    <filter id="aura-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="leaf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="6" stdDeviation="8" flood-color="#064e3b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-glow)" stroke="url(#border-grad)" stroke-width="4"/>

  <!-- Ambient Glow Behind Symbol -->
  <circle cx="256" cy="256" r="140" fill="#06b6d4" opacity="0.12" filter="url(#aura-glow)"/>
  <circle cx="256" cy="256" r="90" fill="#10b981" opacity="0.15" filter="url(#aura-glow)"/>

  <!-- Subtle AI Network Circuit Lines -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="2" stroke-linecap="round">
    <path d="M120 200 L80 200 L60 220" />
    <circle cx="60" cy="220" r="3.5" fill="#38bdf8" />
    
    <path d="M392 200 L432 200 L452 180" />
    <circle cx="452" cy="180" r="3.5" fill="#38bdf8" />

    <path d="M200 392 L200 432 L180 452" />
    <circle cx="180" cy="452" r="3.5" fill="#38bdf8" />

    <path d="M312 392 L312 432 L332 452" />
    <circle cx="332" cy="452" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Main Medical Cross (Rounded Modern Geometry) -->
  <g filter="url(#soft-shadow)">
    <!-- Vertical Bar -->
    <rect x="220" y="112" width="72" height="288" rx="36" fill="url(#cross-grad)"/>
    <!-- Horizontal Bar -->
    <rect x="112" y="220" width="288" height="72" rx="36" fill="url(#cross-grad)"/>
  </g>

  <!-- Center Core Gloss / Glass Highlight on Cross -->
  <g opacity="0.35">
    <rect x="226" y="118" width="60" height="130" rx="30" fill="url(#sparkle-grad)" opacity="0.4"/>
    <rect x="118" y="226" width="130" height="60" rx="30" fill="url(#sparkle-grad)" opacity="0.4"/>
  </g>

  <!-- Elegant Homeopathic Botanical Leaf Swirling Over The Cross -->
  <g filter="url(#leaf-shadow)">
    <path d="M256 128 C340 136 392 208 384 296 C376 384 300 400 248 376 C200 354 184 296 208 248 C232 200 240 160 256 128 Z"
          fill="url(#leaf-grad)" />
    <!-- Leaf Vein & Inner Curves -->
    <path d="M256 150 Q310 240 248 376" stroke="#a7f3d0" stroke-width="4.5" stroke-linecap="round" opacity="0.75" fill="none"/>
    <path d="M276 210 Q315 220 338 205" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" opacity="0.6" fill="none"/>
    <path d="M268 260 Q320 275 348 262" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" opacity="0.6" fill="none"/>
    <path d="M254 310 Q295 330 320 320" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" opacity="0.5" fill="none"/>
  </g>

  <!-- Potentization Energy Droplet / Center Sparkle -->
  <g filter="url(#aura-glow)">
    <circle cx="256" cy="256" r="16" fill="#ffffff" opacity="0.9"/>
    <circle cx="256" cy="256" r="8" fill="#38bdf8"/>
  </g>

  <!-- AI Intelligence Star Sparkles -->
  <!-- Top Right Sparkle -->
  <g transform="translate(370, 95)">
    <path d="M0 -22 Q3 -3 22 0 Q3 3 0 22 Q-3 3 -22 0 Q-3 -3 0 -22 Z" fill="url(#sparkle-grad)" filter="url(#soft-shadow)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>
  <!-- Mini Left Sparkle -->
  <g transform="translate(105, 140) scale(0.65)">
    <path d="M0 -20 Q3 -3 20 0 Q3 3 0 20 Q-3 3 -20 0 Q-3 -3 0 -20 Z" fill="#6ee7b7" opacity="0.9"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
  <!-- Mini Bottom Right Sparkle -->
  <g transform="translate(400, 370) scale(0.55)">
    <path d="M0 -20 Q3 -3 20 0 Q3 3 0 20 Q-3 3 -20 0 Q-3 -3 0 -20 Z" fill="#38bdf8" opacity="0.85"/>
  </g>
</svg>