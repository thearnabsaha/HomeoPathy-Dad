<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradients in Royal Purple -->
    <radialGradient id="bg-purple-512" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#24103c"/>
      <stop offset="50%" stop-color="#140724"/>
      <stop offset="100%" stop-color="#090210"/>
    </radialGradient>
    
    <linearGradient id="border-purple-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Medicine Bottle Glass & Liquid Gradients -->
    <linearGradient id="glass-body-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d60"/>
      <stop offset="40%" stop-color="#200d38"/>
      <stop offset="100%" stop-color="#120622"/>
    </linearGradient>

    <linearGradient id="liquid-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="35%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <!-- Dropper Cap Gradients -->
    <linearGradient id="cap-grad-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="50%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="collar-grad-512" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Capsule Gradients -->
    <linearGradient id="pill-top-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="pill-bot-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow-purple-512" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-shadow-512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="drop-shadow-pill" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="8" stdDeviation="10" flood-color="#581c87" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Purple Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-purple-512)" stroke="url(#border-purple-512)" stroke-width="4"/>

  <!-- Ambient Purple Neon Aura -->
  <circle cx="240" cy="270" r="140" fill="#a855f7" opacity="0.22" filter="url(#glow-purple-512)"/>
  <circle cx="240" cy="270" r="80" fill="#e879f9" opacity="0.28" filter="url(#glow-purple-512)"/>

  <!-- Main Medicine Bottle (Apothecary / Tincture) -->
  <g filter="url(#soft-shadow-512)">
    <!-- Dropper Rubber Bulb Top -->
    <path d="M212 90 C212 72 226 60 244 60 C262 60 276 72 276 90 L276 106 L212 106 Z" fill="url(#cap-grad-512)"/>
    <ellipse cx="244" cy="106" rx="32" ry="5" fill="#c084fc"/>

    <!-- Dropper Metallic Collar -->
    <rect x="220" y="110" width="48" height="20" rx="6" fill="url(#collar-grad-512)"/>
    <rect x="224" y="130" width="40" height="12" rx="4" fill="#a855f7"/>

    <!-- Glass Bottle Body -->
    <path d="M196 142 L292 142 C316 142 334 160 334 184 L334 354 C334 382 312 404 284 404 L204 404 C176 404 154 382 154 354 L154 184 C154 160 172 142 196 142 Z"
          fill="url(#glass-body-512)"
          stroke="#c084fc"
          stroke-width="3.5"
          stroke-opacity="0.4"/>

    <!-- Liquid In Bottle (Glowing Royal Purple Medicine) -->
    <path d="M162 230 C190 220 220 236 244 228 C268 220 298 234 326 226 L326 352 C326 376 306 396 282 396 L206 396 C182 396 162 376 162 352 Z"
          fill="url(#liquid-grad-512)"/>

    <!-- Meniscus / Surface Ripple of Liquid -->
    <path d="M162 230 C190 220 220 236 244 228 C268 220 298 234 326 226" stroke="#f5d0fe" stroke-width="3" opacity="0.75" fill="none"/>

    <!-- Glass Highlights & Sheen -->
    <path d="M172 172 L172 370" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    <path d="M184 172 L184 210" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>

    <!-- Center Medical Cross on Bottle (Pure Glowing White) -->
    <g filter="url(#glow-purple-512)">
      <!-- Vertical bar of cross -->
      <rect x="233" y="270" width="22" height="76" rx="8" fill="#ffffff"/>
      <!-- Horizontal bar of cross -->
      <rect x="206" y="297" width="76" height="22" rx="8" fill="#ffffff"/>
      <!-- Center dot -->
      <circle cx="244" cy="308" r="4" fill="#a855f7"/>
    </g>
  </g>

  <!-- Medicine Capsule (Pill) Floating Angled on Right -->
  <g transform="translate(362, 335) rotate(-38)" filter="url(#drop-shadow-pill)">
    <!-- Top Half of Capsule -->
    <path d="M-22 -44 C-22 -62 -4 -76 14 -76 C32 -76 50 -62 50 -44 L50 -6 L-22 -6 Z" fill="url(#pill-top-512)"/>
    <!-- Bottom Half of Capsule -->
    <path d="M-22 -6 L50 -6 L50 32 C50 50 32 64 14 64 C-4 64 -22 50 -22 32 Z" fill="url(#pill-bot-512)"/>
    <!-- Central Seam Ring -->
    <rect x="-23" y="-8" width="74" height="4" rx="2" fill="#ffffff" opacity="0.9"/>
    <!-- Capsule Gloss Line -->
    <path d="M-10 -58 L-10 42" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Homeopathic Potentization Droplet (Left) -->
  <g transform="translate(108, 220)" filter="url(#glow-purple-512)">
    <path d="M22 0 C22 0 44 28 44 46 C44 62 34 74 22 74 C10 74 0 62 0 46 C0 28 22 0 22 0 Z" fill="url(#liquid-grad-512)"/>
    <path d="M12 40 C12 30 18 20 22 14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- AI Intelligence Sparkles & Stars -->
  <!-- Top Right Sparkle -->
  <g transform="translate(390, 105)">
    <path d="M0 -26 Q4 -4 26 0 Q4 4 0 26 Q-4 4 -26 0 Q-4 -4 0 -26 Z" fill="#ffffff" filter="url(#glow-purple-512)"/>
    <circle cx="0" cy="0" r="4.5" fill="#f0abfc"/>
  </g>

  <!-- Left Accent Star -->
  <g transform="translate(95, 120) scale(0.65)">
    <path d="M0 -22 Q3 -3 22 0 Q3 3 0 22 Q-3 3 -22 0 Q-3 -3 0 -22 Z" fill="#e879f9"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Micro Sparkle -->
  <g transform="translate(420, 230) scale(0.45)">
    <path d="M0 -20 Q3 -3 20 0 Q3 3 0 20 Q-3 3 -20 0 Q-3 -3 0 -20 Z" fill="#f5d0fe"/>
  </g>
</svg>