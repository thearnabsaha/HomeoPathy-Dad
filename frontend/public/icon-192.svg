<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" fill="none">
  <defs>
    <radialGradient id="bg-purple-192" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#24103c"/>
      <stop offset="50%" stop-color="#140724"/>
      <stop offset="100%" stop-color="#090210"/>
    </radialGradient>
    
    <linearGradient id="border-purple-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="liquid-grad-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="80%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <linearGradient id="cap-grad-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="50%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="pill-top-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="pill-bot-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>

    <filter id="soft-shadow-192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="6" y="6" width="180" height="180" rx="40" fill="url(#bg-purple-192)" stroke="url(#border-purple-192)" stroke-width="2"/>

  <!-- Ambient Glow -->
  <circle cx="90" cy="100" r="50" fill="#a855f7" opacity="0.25"/>

  <!-- Medicine Dropper Bottle -->
  <g filter="url(#soft-shadow-192)">
    <!-- Dropper Bulb Top -->
    <path d="M79 34 C79 27 84 23 91 23 C98 23 103 27 103 34 L103 40 L79 40 Z" fill="url(#cap-grad-192)"/>
    <!-- Collar -->
    <rect x="82" y="42" width="18" height="8" rx="2" fill="#c084fc"/>

    <!-- Glass Body -->
    <path d="M73 54 L109 54 C118 54 125 61 125 70 L125 134 C125 144 117 152 107 152 L75 152 C65 152 57 144 57 134 L57 70 C57 61 64 54 73 54 Z"
          fill="#1e0c32" stroke="#c084fc" stroke-width="1.8" stroke-opacity="0.5"/>

    <!-- Glowing Liquid -->
    <path d="M60 88 C71 84 82 90 91 87 C100 84 111 89 122 86 L122 133 C122 142 115 149 106 149 L76 149 C67 149 60 142 60 133 Z"
          fill="url(#liquid-grad-192)"/>

    <!-- Glass Sheen -->
    <path d="M64 66 L64 140" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- Glowing White Medical Cross -->
    <rect x="87" y="102" width="8" height="30" rx="3" fill="#ffffff"/>
    <rect x="76" y="113" width="30" height="8" rx="3" fill="#ffffff"/>
    <circle cx="91" cy="117" r="1.5" fill="#a855f7"/>
  </g>

  <!-- Floating Medicine Capsule Pill -->
  <g transform="translate(136, 126) rotate(-38)">
    <path d="M-8 -16 C-8 -23 -1 -28 6 -28 C13 -28 20 -23 20 -16 L20 -2 L-8 -2 Z" fill="url(#pill-top-192)"/>
    <path d="M-8 -2 L20 -2 L20 12 C20 19 13 24 6 24 C-1 24 -8 19 -8 12 Z" fill="url(#pill-bot-192)"/>
    <rect x="-9" y="-3" width="30" height="2" rx="1" fill="#ffffff"/>
    <path d="M-4 -20 L-4 16" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Homeopathic Potentization Droplet (Left) -->
  <g transform="translate(38, 82)">
    <path d="M9 0 C9 0 18 11 18 18 C18 25 14 30 9 30 C4 30 0 25 0 18 C0 11 9 0 9 0 Z" fill="url(#liquid-grad-192)"/>
    <path d="M5 16 C5 12 7 8 9 6" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- AI Sparkles -->
  <g transform="translate(146, 40) scale(0.4)">
    <path d="M0 -24 Q4 -4 24 0 Q4 4 0 24 Q-4 4 -24 0 Q-4 -4 0 -24 Z" fill="#ffffff"/>
    <circle cx="0" cy="0" r="4" fill="#e879f9"/>
  </g>
  <g transform="translate(36, 46) scale(0.25)">
    <path d="M0 -20 Q3 -3 20 0 Q3 3 0 20 Q-3 3 -20 0 Q-3 -3 0 -20 Z" fill="#f5d0fe"/>
  </g>
</svg>