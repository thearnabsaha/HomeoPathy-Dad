<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" fill="none">
  <defs>
    <radialGradient id="no-leaf-bg-192" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0f1f1a"/>
      <stop offset="50%" stop-color="#08120f"/>
      <stop offset="100%" stop-color="#030605"/>
    </radialGradient>

    <linearGradient id="no-leaf-border-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="cross-main-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="30%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="ring-glow-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="80%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="cross-shadow-192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="180" height="180" rx="40" fill="url(#no-leaf-bg-192)" stroke="url(#no-leaf-border-192)" stroke-width="1.5"/>

  <circle cx="96" cy="96" r="50" fill="#10b981" opacity="0.2"/>

  <g transform="translate(96, 96)">
    <!-- Framing Circle Arc -->
    <path d="M-50 50 A70 70 0 1 1 50 -50"
          fill="none"
          stroke="url(#ring-glow-192)"
          stroke-width="4.5"
          stroke-linecap="round"/>

    <!-- Accent Arc -->
    <path d="M56 -35 A70 70 0 0 1 70 -4"
          fill="none"
          stroke="url(#ring-glow-192)"
          stroke-width="2.2"
          stroke-linecap="round"
          opacity="0.8"/>

    <!-- Medical Cross -->
    <g filter="url(#cross-shadow-192)">
      <rect x="-16" y="-46" width="32" height="92" rx="11" fill="url(#cross-main-192)"/>
      <rect x="-46" y="-16" width="92" height="32" rx="11" fill="url(#cross-main-192)"/>

      <!-- Center Highlight -->
      <circle cx="0" cy="0" r="6" fill="#ffffff" opacity="0.9"/>
      <circle cx="0" cy="0" r="3" fill="#10b981"/>
    </g>

    <!-- Sparkle -->
    <g transform="translate(54, -36) scale(0.28)">
      <path d="M0 -22 Q3 -3 22 0 Q3 3 0 22 Q-3 3 -22 0 Q-3 -3 0 -22 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>