<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" fill="none">
  <defs>
    <radialGradient id="homeo-bg-192" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#281043"/>
      <stop offset="50%" stop-color="#150626"/>
      <stop offset="100%" stop-color="#080210"/>
    </radialGradient>
    
    <linearGradient id="homeo-border-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="mortar-rim-192" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <linearGradient id="pestle-grad-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f5d0fe"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <linearGradient id="herb-grad-192" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="60%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>

    <linearGradient id="drop-grad-192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f5d0fe"/>
      <stop offset="80%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <radialGradient id="pellet-grad-192" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </radialGradient>

    <filter id="soft-shadow-192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="6" y="6" width="180" height="180" rx="40" fill="url(#homeo-bg-192)" stroke="url(#homeo-border-192)" stroke-width="2"/>

  <!-- Ambient Glow -->
  <circle cx="96" cy="102" r="55" fill="#9333ea" opacity="0.25"/>

  <g filter="url(#soft-shadow-192)">
    <!-- Pestle (Handle angled) -->
    <g transform="translate(86, 78) rotate(-38)">
      <path d="M-6 -50 C-6 -56 0 -60 6 -60 C12 -60 18 -56 18 -50 L16 10 C16 18 10 24 6 24 C2 24 -4 18 -4 10 Z" fill="url(#pestle-grad-192)"/>
      <path d="M-2 -54 L1 12" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
    </g>

    <!-- Mortar Base -->
    <ellipse cx="96" cy="146" rx="38" ry="8" fill="#1e0840" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Mortar Bowl Body -->
    <path d="M50 92 C50 126 70 140 96 140 C122 140 142 126 142 92 Z"
          fill="#2e1065" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Inner Cavity -->
    <ellipse cx="96" cy="92" rx="44" ry="12" fill="#150626"/>

    <!-- Mortar Lip Rim -->
    <ellipse cx="96" cy="92" rx="46" ry="12" fill="none" stroke="url(#mortar-rim-192)" stroke-width="2.5"/>
    
    <!-- Sheen on Mortar -->
    <path d="M62 102 C66 124 80 134 96 134" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.4" fill="none"/>
  </g>

  <!-- Homeopathic Sugar Globules (Pellets) -->
  <circle cx="96" cy="93" r="5.5" fill="url(#pellet-grad-192)"/>
  <circle cx="106" cy="96" r="4.5" fill="url(#pellet-grad-192)"/>
  <circle cx="86" cy="96" r="5" fill="url(#pellet-grad-192)"/>
  <circle cx="94" cy="101" r="4" fill="url(#pellet-grad-192)"/>
  <circle cx="128" cy="128" r="5" fill="url(#pellet-grad-192)"/>
  <circle cx="138" cy="136" r="3.5" fill="url(#pellet-grad-192)"/>
  <circle cx="60" cy="133" r="4" fill="url(#pellet-grad-192)"/>

  <!-- Homeopathic Herbal Branch -->
  <path d="M112 90 C130 76 142 58 144 36" stroke="url(#herb-grad-192)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M144 36 C150 40 156 37 157 30 C155 24 148 24 144 36 Z" fill="url(#herb-grad-192)"/>
  <path d="M138 48 C148 51 152 45 153 40 C146 38 141 42 138 48 Z" fill="url(#herb-grad-192)"/>
  <path d="M126 65 C118 60 116 53 120 49 C126 51 128 58 126 65 Z" fill="url(#herb-grad-192)"/>

  <!-- Potentization Droplet (Dynamization) -->
  <path d="M96 36 C96 36 105 51 105 58 C105 64 101 68 96 68 C91 68 87 64 87 58 C87 51 96 36 96 36 Z"
        fill="url(#drop-grad-192)"/>
  <circle cx="96" cy="59" r="1.8" fill="#ffffff"/>

  <!-- Sparkles -->
  <g transform="translate(48, 42) scale(0.35)">
    <path d="M0 -24 Q4 -4 24 0 Q4 4 0 24 Q-4 4 -24 0 Q-4 -4 0 -24 Z" fill="#ffffff"/>
    <circle cx="0" cy="0" r="4" fill="#f0abfc"/>
  </g>
</svg>